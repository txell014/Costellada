<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Costellada - Panell Admin</title>

  <!-- Tailwind CSS per CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f7f6f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- HEADER SUPERIOR ADMIN -->
  <header class="w-full bg-white border-b border-neutral-200/60 py-3 px-4 sm:px-8 mb-6 sticky top-0 z-10 shadow-sm">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="p-1.5 rounded-lg bg-orange-500 text-white">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <span class="font-extrabold text-neutral-900 text-base sm:text-lg">Panell d'Administració</span>
      </div>
      <button onclick="logout()" class="text-xs font-semibold text-neutral-400 hover:text-red-500 transition-colors flex items-center gap-1">
        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
        <span>Sortir</span>
      </button>
    </div>
  </header>

  <!-- CONTENIDOR PRINCIPAL -->
  <main class="max-w-3xl mx-auto px-4 space-y-6">

    <!-- RESUM GLOBAL -->
    <div class="grid grid-cols-2 gap-3 sm:gap-4">
      <div class="bg-white p-4 rounded-3xl border border-neutral-100 shadow-sm flex items-center gap-3">
        <div class="p-3 rounded-2xl bg-orange-50 text-orange-500">
          <i data-lucide="users" class="w-6 h-6"></i>
        </div>
        <div>
          <p class="text-xs font-bold text-neutral-400 uppercase tracking-wider">Jugadors Actius</p>
          <h3 id="statLoggedIn" class="text-xl sm:text-2xl font-black text-neutral-800">0/0</h3>
        </div>
      </div>

      <div class="bg-white p-4 rounded-3xl border border-neutral-100 shadow-sm flex items-center gap-3">
        <div class="p-3 rounded-2xl bg-emerald-50 text-emerald-500">
          <i data-lucide="lightbulb" class="w-6 h-6"></i>
        </div>
        <div>
          <p class="text-xs font-bold text-neutral-400 uppercase tracking-wider">Propostes Totals</p>
          <h3 id="statSuggestions" class="text-xl sm:text-2xl font-black text-neutral-800">0</h3>
        </div>
      </div>
    </div>

    <!-- SECCIÓ DE LLISTAT D'EQUIPS -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-neutral-900 flex items-center gap-2">
          <i data-lucide="layout-grid" class="w-5 h-5 text-neutral-500"></i>
          Equips i Jugadors
        </h2>
        <span class="text-xs text-neutral-400 font-medium">Fes clic en un equip per veure el detall</span>
      </div>

      <!-- GRID D'EQUIPS -->
      <div id="teamsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Es carregarà dinàmicament -->
      </div>
    </section>

  </main>

  <!-- MODAL DE DETALL D'EQUIP -->
  <div id="teamModal" class="fixed inset-0 bg-neutral-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-xl max-h-[90vh] flex flex-col overflow-hidden border border-neutral-100">
      
      <!-- Modal Header -->
      <div id="modalHeader" class="p-5 border-b border-neutral-100 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="modalTeamCircle" class="w-6 h-6 rounded-full"></div>
          <h3 id="modalTeamTitle" class="text-xl font-black text-neutral-800">Detall de l'equip</h3>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-neutral-100 text-neutral-500 flex items-center justify-center hover:bg-neutral-200">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-5 space-y-6 overflow-y-auto">
        
        <!-- Jugadors de l'equip -->
        <div class="space-y-2">
          <h4 class="text-xs font-bold uppercase text-neutral-400 tracking-wider">Jugadors de l'equip</h4>
          <div id="modalPlayersList" class="space-y-1.5">
            <!-- Dinàmic -->
          </div>
        </div>

        <!-- Propostes i Vots -->
        <div class="space-y-3">
          <h4 class="text-xs font-bold uppercase text-neutral-400 tracking-wider">Propostes de Nom i Vots</h4>
          <div id="modalSuggestionsList" class="space-y-3">
            <!-- Dinàmic -->
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- LÒGICA JS -->
  <script>
    const SUPABASE_URL = 'https://bhgvnkhewhdvltpsajqm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qgX6u8s01wg0hYngVq5kJw_37ep4SNj';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allTeamsData = [];

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();

      // Validar sessió admin
      const savedUser = localStorage.getItem('player_session');
      if (!savedUser) {
        window.location.href = 'index.html';
        return;
      }

      const user = JSON.parse(savedUser);
      if (!user.is_admin) {
        alert('Accés restringit només a l\'administrador.');
        window.location.href = 'dashboard.html';
        return;
      }

      await loadAdminData();
    });

    async function loadAdminData() {
      try {
        // Carregar equips, jugadors, propostes i vots
        const { data: teams, error: tErr } = await db
          .from('teams')
          .select(`
            *,
            players(*),
            team_suggestions(
              *,
              players!suggested_by(name, player_number),
              team_votes(
                *,
                players(name, player_number)
              )
            )
          `)
          .order('name')
          .order('player_number', { referencedTable: 'players', ascending: true });

        if (tErr) throw tErr;

        allTeamsData = teams || [];
        renderStats();
        renderTeamsGrid();

      } catch (err) {
        console.error('Error carregant dades d\'admin:', err);
      }
    }

    function renderStats() {
      let totalPlayers = 0;
      let loggedInCount = 0;
      let totalSuggestions = 0;

      allTeamsData.forEach(team => {
        team.players.forEach(p => {
          if (!p.is_admin) {
            totalPlayers++;
            if (p.has_logged_in) loggedInCount++;
          }
        });
        totalSuggestions += team.team_suggestions ? team.team_suggestions.length : 0;
      });

      document.getElementById('statLoggedIn').textContent = `${loggedInCount}/${totalPlayers}`;
      document.getElementById('statSuggestions').textContent = totalSuggestions;
    }

    function renderTeamsGrid() {
      const grid = document.getElementById('teamsGrid');
      grid.innerHTML = '';

      allTeamsData.forEach(team => {
        const teamPlayers = team.players.filter(p => !p.is_admin);
        const loggedInCount = teamPlayers.filter(p => p.has_logged_in).length;
        const styles = getTeamStyles(team.color);

        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl p-5 shadow-sm border border-neutral-100 hover:border-neutral-300 transition-all cursor-pointer space-y-4";
        card.onclick = () => openTeamModal(team.id);

        let playersListHtml = teamPlayers.map(p => `
          <div class="flex items-center justify-between text-xs py-1 border-b border-neutral-50 last:border-0">
            <span class="font-semibold text-neutral-700">Jugador ${p.player_number || '?'}: ${escapeHtml(p.name)}</span>
            ${p.has_logged_in 
              ? '<span class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Dins</span>' 
              : '<span class="inline-flex items-center gap-1 text-[10px] font-bold text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-neutral-300"></span> Pendent</span>'}
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <span class="w-4 h-4 rounded-full" style="background-color: ${styles.dotColor}"></span>
              <h3 class="font-black text-lg text-neutral-800">Equip "${team.color}"</h3>
            </div>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-neutral-100 text-neutral-600">
              ${loggedInCount}/${teamPlayers.length} dins
            </span>
          </div>

          <div class="space-y-0.5 pt-1">
            ${playersListHtml}
          </div>

          <div class="pt-2 flex items-center justify-between text-xs text-orange-500 font-bold border-t border-neutral-100">
            <span>${team.team_suggestions ? team.team_suggestions.length : 0} propostes de nom</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function openTeamModal(teamId) {
      const team = allTeamsData.find(t => t.id === teamId);
      if (!team) return;

      const styles = getTeamStyles(team.color);
      document.getElementById('modalTeamCircle').style.backgroundColor = styles.dotColor;
      document.getElementById('modalTeamTitle').textContent = `Equip "${team.color}"`;

      // Renderitzem jugadors al modal
      const teamPlayers = team.players.filter(p => !p.is_admin);
      const playersContainer = document.getElementById('modalPlayersList');
      playersContainer.innerHTML = teamPlayers.map(p => `
        <div class="flex items-center justify-between p-2.5 rounded-2xl bg-neutral-50 text-xs">
          <div class="font-medium text-neutral-800">
            <strong class="text-neutral-500 mr-1">J${p.player_number}:</strong> ${escapeHtml(p.name)}
          </div>
          ${p.has_logged_in 
            ? '<span class="text-[10px] font-bold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full">S\'ha connectat</span>' 
            : '<span class="text-[10px] font-bold text-neutral-400 bg-neutral-200 px-2 py-0.5 rounded-full">Pendent</span>'}
        </div>
      `).join('');

      // Renderitzem propostes i qui ha votat cada una
      const suggestionsContainer = document.getElementById('modalSuggestionsList');
      const suggestions = team.team_suggestions || [];

      if (suggestions.length === 0) {
        suggestionsContainer.innerHTML = `
          <p class="text-xs text-neutral-400 italic text-center py-4">Aquest equip encara no té cap proposta de nom.</p>
        `;
      } else {
        suggestionsContainer.innerHTML = suggestions.map(s => {
          const authorName = s.players ? s.players.name : 'Desconegut';
          const authorNum = s.players ? s.players.player_number : '?';
          const votes = s.team_votes || [];

          const votersListHtml = votes.length > 0 
            ? votes.map(v => `<span class="inline-block bg-white border border-neutral-200 rounded-lg px-2 py-0.5 text-[11px] font-medium text-neutral-600 mr-1 mb-1">${escapeHtml(v.players ? v.players.name : 'Jugador')}</span>`).join('')
            : '<span class="text-[11px] text-neutral-400 italic">Sense vots encara</span>';

          return `
            <div class="bg-neutral-50 rounded-2xl p-4 space-y-2 border border-neutral-100">
              <div class="flex items-start justify-between">
                <div>
                  <h5 class="font-black text-neutral-800 text-base">${escapeHtml(s.suggested_name)}</h5>
                  <p class="text-xs text-neutral-500">Proposat per: <strong>${escapeHtml(authorName)}</strong> (Jugador ${authorNum})</p>
                </div>
                <span class="inline-flex items-center gap-1 bg-orange-100 text-orange-600 text-xs font-bold px-2.5 py-1 rounded-full">
                  <i data-lucide="thumbs-up" class="w-3 h-3"></i> ${votes.length}
                </span>
              </div>

              <div class="pt-2 border-t border-neutral-200/60">
                <p class="text-[10px] font-bold text-neutral-400 uppercase mb-1">Votat per:</p>
                <div class="flex flex-wrap">${votersListHtml}</div>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('teamModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('teamModal').classList.add('hidden');
    }

    function getTeamStyles(colorName) {
      switch (colorName.toLowerCase()) {
        case 'groc': return { dotColor: '#eab308' };
        case 'blau': return { dotColor: '#3b82f6' };
        case 'rosa': return { dotColor: '#ec4899' };
        case 'verd': return { dotColor: '#22c55e' };
        default: return { dotColor: '#a3a3a3' };
      }
    }

    function logout() {
      localStorage.removeItem('player_session');
      window.location.href = 'index.html';
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function(s) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[s];
      });
    }
  </script>
</body>
</html>
