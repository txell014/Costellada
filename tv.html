<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Costellada - Projector TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { 
      background-color: #f7f6f2; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      overflow: hidden; 
    }
    .letter-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 6rem;
      height: 7.5rem;
      border-bottom: 10px solid #f97316;
      font-size: 4.5rem;
      font-weight: 900;
      text-transform: uppercase;
      margin: 0 10px;
      transition: all 0.3s ease;
    }
    @keyframes timerBeat {
      0% { transform: scale(1); }
      30% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    .animate-timer-beat {
      animation: timerBeat 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 sm:p-6 select-none text-neutral-900 text-3xl">
  <!-- SLIDE 1: BENVINGUDA -->
  <div id="slide_benvinguda" class="slide-view h-full flex flex-col items-center justify-center text-center space-y-12">
    <div class="space-y-6">
      <div class="flex items-center justify-center gap-8">
        <i data-lucide="beef" class="w-36 h-36 text-orange-500 stroke-[2.5]"></i>
        <i data-lucide="trophy" class="w-36 h-36 text-amber-500 stroke-[2.5]"></i>
      </div>
      <h1 class="text-8xl sm:text-9xl font-black text-neutral-900 tracking-tight">La Costellada</h1>
    </div>
    <div id="welcomeTeamsGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-8 w-full max-w-[95vw]"></div>
  </div>

  <!-- SLIDE 2: RONDA ACTUAL -->ç
  <div id="slide_ronda_actual" class="slide-view h-full flex flex-col justify-between hidden space-y-4">
   <div class="flex items-center justify-between border-b-4 border-neutral-200 pt-0 pb-8 px-2">
      <div class="flex items-center gap-6">
        <div id="gameIconBox" class="p-3 rounded-3xl bg-orange-50 text-orange-500">
          <i data-lucide="gamepad-2" class="w-16 h-16 stroke-[2.5]"></i>
        </div>
        <div>
          <span id="gameOrderBadge" class="text-3xl font-black uppercase tracking-wider text-orange-500 bg-orange-100 px-6 py-2 rounded-full">Joc 1</span>
          <h2 id="gameTitle" class="text-6xl sm:text-7xl font-black text-neutral-900 mt-1">Carregant Joc...</h2>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-6 flex-1 items-start">
      <!-- ESQUERRA: CONTINGUT DEL JOC -->
      <div id="gameContentBox" class="col-span-8 bg-white rounded-3xl p-6 shadow-sm border-4 border-neutral-100 h-full flex flex-col justify-center space-y-6"></div>

      <!-- DRETA: CLASSIFICACIÓ JOC ACTIU -->
      <div class="col-span-4 bg-white rounded-3xl p-6 shadow-sm border-4 border-neutral-100 space-y-6">
        <div class="flex items-center justify-between border-b-4 border-neutral-100 pb-4">
          <h3 class="text-4xl font-black text-neutral-800 flex items-center gap-3">
            <i data-lucide="trophy" class="w-10 h-10 text-amber-500"></i>
            Classificació
          </h3>
          <span class="text-xl font-black text-neutral-400 uppercase tracking-wider">Joc actual</span>
        </div>
        <div id="liveSidebarScores" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <!-- SLIDE 3: PUNTUACIÓ EQUIPS -->
  <div id="slide_puntuacio_equips" class="slide-view h-full flex flex-col items-center justify-center text-center space-y-12 hidden">
    <div class="space-y-4">
      <h2 class="text-8xl sm:text-9xl font-black text-neutral-900">Marcador General</h2>
      <p class="text-4xl text-neutral-500 font-extrabold">Puntuació acumulada durant la nit</p>
    </div>
    <div id="fullScoreboardGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-8 w-full max-w-[95vw]"></div>
  </div>

  <!-- SLIDE 4: CLASSIFICACIÓ FINAL -->
  <div id="slide_classificacio" class="slide-view h-full flex flex-col items-center justify-center text-center space-y-10 hidden">
    <div class="space-y-4">
      <i data-lucide="crown" class="w-36 h-36 text-amber-500 mx-auto stroke-[2.5]"></i>
      <h2 class="text-9xl font-black text-neutral-900">Podi Final</h2>
      <p class="text-5xl text-orange-500 font-black">Guanyadors de La Costellada!</p>
    </div>
    <div id="podiumContainer" class="flex items-end justify-center gap-8 w-full max-w-[95vw] h-[50vh] pt-6"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bhgvnkhewhdvltpsajqm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qgX6u8s01wg0hYngVq5kJw_37ep4SNj';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allTeams = [];
    let allGames = [];
    let allScores = [];
    let currentState = { active_slide: 'benvinguda', active_game_id: null, active_subround: 0, reveal_solution: false };

    const mimicaPhrases = [
      "INTRODUCCIO",
      "Els tres porquets i el llop",
      "Els teletubis",
      "Les tres bessones i la bruixa avorrida",
      "Els àngels de Charlie",
      "Els tres mosqueters i en d'Artagnan"
    ];

    const llenguaPhrases = [
      "INTRODUCCIO",
      "El sabater és el qui va més mal calçat",
      "Al lloc de la guineu, qui se n'alça ja no hi seu",
      "Qui no vulgui pols, que no vagi a l'era",
      "Val més boig conegut que savi per conéixer"
    ];

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await loadTVData();
      setupRealtimeSubscriptions();
    });

    async function loadTVData() {
      try {
        const { data: teams } = await db.from('teams').select('*').order('name');
        allTeams = teams || [];

        const { data: games } = await db.from('games').select('*').order('order_num');
        allGames = games || [];

        const { data: scores } = await db.from('scores').select('*');
        allScores = scores || [];

        const { data: state } = await db.from('game_state').select('*').eq('id', 1).maybeSingle();
        if (state) {
          currentState = state;
        }

        renderAll();

      } catch (err) {
        console.error('Error carregant dades TV:', err);
      }
    }

    function setupRealtimeSubscriptions() {
      db.channel('tv_realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state' }, payload => {
          if (payload.new) {
            currentState = payload.new;
            renderSlide(currentState.active_slide, currentState.active_game_id);
            handleTimerState();
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'scores' }, async () => {
          const { data: scores } = await db.from('scores').select('*');
          allScores = scores || [];
          renderScores();
        })
        .subscribe();

      setInterval(async () => {
        const { data: state } = await db.from('game_state').select('*').eq('id', 1).maybeSingle();
        if (state) {
          const changed = state.active_slide !== currentState.active_slide ||
                          state.active_game_id !== currentState.active_game_id ||
                          state.active_subround !== currentState.active_subround ||
                          state.reveal_solution !== currentState.reveal_solution ||
                          state.timer_running !== currentState.timer_running;

          if (changed) {
            currentState = state;
            renderSlide(currentState.active_slide, currentState.active_game_id);
            handleTimerState();
          }
        }
      }, 1000);
    }

    function renderAll() {
      renderWelcomeTeams();
      renderScores();
      renderSlide(currentState.active_slide, currentState.active_game_id);
    }

    function getRankedTeamsForGame(gameId) {
      if (!gameId) return allTeams.map(t => ({ ...t, gamePoints: 0 }));

      return allTeams.map(team => {
        const gameTotal = allScores
          .filter(s => String(s.game_id) === String(gameId) && String(s.team_id) === String(team.id))
          .reduce((acc, curr) => acc + (Number(curr.points) || 0), 0);
        
        return { ...team, gamePoints: gameTotal };
      }).sort((a, b) => b.gamePoints - a.gamePoints);
    }

    function getRankedTeams() {
      return allTeams.map(team => {
        const teamTotal = allScores
          .filter(s => String(s.team_id) === String(team.id))
          .reduce((acc, curr) => acc + (Number(curr.points) || 0), 0);
        return { ...team, totalPoints: teamTotal };
      }).sort((a, b) => b.totalPoints - a.totalPoints);
    }

    function renderSlide(slideName, gameId) {
      document.querySelectorAll('.slide-view').forEach(s => s.classList.add('hidden'));

      const targetSlide = document.getElementById(`slide_${slideName}`);
      if (targetSlide) {
        targetSlide.classList.remove('hidden');
      }

      renderScores();

      if (slideName === 'ronda_actual' && gameId) {
        renderActiveGameContent(gameId);
      } else if (slideName === 'classificacio') {
        renderPodium();
      }

      lucide.createIcons();
    }

    function renderWelcomeTeams() {
      const grid = document.getElementById('welcomeTeamsGrid');
      grid.innerHTML = allTeams.map(team => {
        const styles = getTeamStyles(team.color);
        return `
          <div class="bg-white rounded-3xl p-8 border-4 shadow-sm flex flex-col items-center space-y-4" style="background-color: ${styles.bannerBg}; border-color: ${styles.bannerBorder}">
            <div class="w-24 h-24 rounded-full shadow-inner" style="background-color: ${styles.dotColor}"></div>
            <h3 class="font-black text-5xl" style="color: ${styles.textColor}">${team.name}</h3>
          </div>
        `;
      }).join('');
    }

    function renderScores() {
      const sidebar = document.getElementById('liveSidebarScores');
      if (sidebar && currentState.active_game_id) {
        const rankedGame = getRankedTeamsForGame(currentState.active_game_id);
        
        sidebar.innerHTML = rankedGame.map((team, index) => {
          const styles = getTeamStyles(team.color);
          return `
            <div class="flex items-center justify-between p-5 rounded-2xl border-4 transition-all" style="background-color: ${styles.bannerBg}; border-color: ${styles.bannerBorder}">
              <div class="flex items-center gap-4">
                <span class="text-3xl font-black text-neutral-400 w-10">${index + 1}º</span>
                <span class="w-8 h-8 rounded-full" style="background-color: ${styles.dotColor}"></span>
                <span class="font-black text-3xl" style="color: ${styles.textColor}">${team.name}</span>
              </div>
              <span class="font-black text-4xl text-neutral-800">${team.gamePoints} <span class="text-xl font-bold text-neutral-400">pts</span></span>
            </div>
          `;
        }).join('');
      }

      const fullGrid = document.getElementById('fullScoreboardGrid');
      if (fullGrid) {
        const rankedTotal = getRankedTeams();
        fullGrid.innerHTML = rankedTotal.map(team => {
          const styles = getTeamStyles(team.color);
          return `
            <div class="bg-white rounded-3xl p-10 border-4 shadow-sm flex flex-col items-center space-y-6" style="background-color: ${styles.bannerBg}; border-color: ${styles.bannerBorder}">
              <div class="w-28 h-28 rounded-full shadow-inner" style="background-color: ${styles.dotColor}"></div>
              <h3 class="font-black text-5xl" style="color: ${styles.textColor}">${team.name}</h3>
              <div class="text-8xl font-black text-neutral-800">${team.totalPoints}</div>
            </div>
          `;
        }).join('');
      }
    }

    function renderActiveGameContent(gameId) {
      const game = allGames.find(g => g.id === gameId);
      if (!game) return;

      document.getElementById('gameOrderBadge').textContent = `Joc ${game.order_num}`;
      document.getElementById('gameTitle').textContent = game.title;

      const contentBox = document.getElementById('gameContentBox');

      if (game.order_num === 1) { // Mímica
        const subIndex = currentState.active_subround || 0;

        if (subIndex === 0) {
          document.getElementById('gameOrderBadge').parentElement.parentElement.parentElement.classList.add('hidden');
          const sidebarCol = document.getElementById('liveSidebarScores').parentElement;
          sidebarCol.classList.add('hidden');

          contentBox.className = "col-span-12 bg-white rounded-3xl p-8 shadow-sm border-4 border-neutral-100 h-full flex flex-col items-center justify-center text-center relative overflow-hidden";

          contentBox.innerHTML = `
            <div id="introStep1" class="space-y-8 transition-all duration-1000 ease-in-out opacity-100 scale-100">
              <div class="p-6 rounded-3xl bg-purple-50 text-purple-600 inline-block shadow-inner">
                <i data-lucide="theater" class="w-32 h-32 stroke-[2]"></i>
              </div>
              <h1 class="text-9xl font-black text-neutral-900 tracking-tight">Mímica en Grup</h1>
              <p class="text-6xl font-extrabold text-purple-600">Esteu preparats?</p>
            </div>

            <div id="introStep2" class="space-y-8 w-full max-w-[95vw] absolute inset-0 m-auto flex flex-col justify-center px-4 transition-all duration-1000 ease-in-out opacity-0 pointer-events-none translate-y-6">
              <div class="space-y-2">
                <span class="text-3xl font-black uppercase text-purple-600 bg-purple-100 px-8 py-3 mb-4 rounded-full">Regles del Joc</span>
                <h2 class="text-7xl font-black text-neutral-900">Com es juga a la Mímica en grup?</h2>
              </div>

              <div class="grid grid-cols-2 gap-6 text-left">
                <div class="p-6 bg-neutral-50 rounded-2xl border-2 border-neutral-100 space-y-2">
                  <div class="flex items-center gap-3 text-purple-600 font-bold text-4xl">
                    <i data-lucide="users" class="w-10 h-10"></i> <span>Tothom hi participa</span>
                  </div>
                  <p class="text-3xl text-neutral-700 font-extrabold leading-relaxed">Un jugador de cada equip sortirà alhora a fer mímica, que serà conjunta.</p>
                </div>

                <div class="p-6 bg-neutral-50 rounded-2xl border-2 border-neutral-100 space-y-2">
                  <div class="flex items-center gap-3 text-purple-600 font-bold text-4xl">
                    <i data-lucide="volume-x" class="w-10 h-10"></i> <span>Silenci absolut</span>
                  </div>
                  <p class="text-3xl text-neutral-700 font-extrabold leading-relaxed">Només gestos i moviments. Està totalment prohibit fer cap mena de so o soroll!</p>
                </div>

                <div class="p-6 bg-neutral-50 rounded-2xl border-2 border-neutral-100 space-y-2">
                  <div class="flex items-center gap-3 text-purple-600 font-bold text-4xl">
                    <i data-lucide="pencil" class="w-10 h-10"></i> <span>Apunteu al paper</span>
                  </div>
                  <p class="text-3xl text-neutral-700 font-extrabold leading-relaxed">Escriviu al paper el que creieu que s'està representant.</p>
                </div>

                <div class="p-6 bg-neutral-50 rounded-2xl border-2 border-neutral-100 space-y-2">
                  <div class="flex items-center gap-3 text-purple-600 font-bold text-4xl">
                    <i data-lucide="zap" class="w-10 h-10"></i> <span>Entrega ràpida</span>
                  </div>
                  <p class="text-3xl text-neutral-700 font-extrabold leading-relaxed">Quan ho tingueu, doneu el paper. La puntuació depèn de la rapidesa i l'encert!</p>
                </div>
              </div>
            </div>
          `;

          setTimeout(() => {
            const step1 = document.getElementById('introStep1');
            const step2 = document.getElementById('introStep2');
            if (step1 && step2) {
              step1.classList.remove('opacity-100', 'scale-100');
              step1.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none');
              step2.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-6');
              step2.classList.add('opacity-100', 'translate-y-0');
            }
          }, 5000);

        } else {
          document.getElementById('gameOrderBadge').parentElement.parentElement.parentElement.classList.remove('hidden');
          const sidebarCol = document.getElementById('liveSidebarScores').parentElement;
          sidebarCol.classList.remove('hidden');

          contentBox.className = "col-span-8 bg-white rounded-3xl p-6 shadow-sm border-4 border-neutral-100 h-full flex flex-col justify-center space-y-6";

          const phrase = mimicaPhrases[subIndex] || mimicaPhrases[1];
          const isRevealed = currentState.reveal_solution;

          const words = phrase.split(' ');
          const phraseHtml = words.map(word => {
            const letters = word.split('').map(char => {
              const displayChar = isRevealed ? char : '_';
              const colorClass = isRevealed ? 'text-orange-600 border-orange-500' : 'text-neutral-300 border-neutral-300';
              return `<span class="letter-box ${colorClass}">${displayChar}</span>`;
            }).join('');
            return `<div class="inline-flex my-4 mx-4">${letters}</div>`;
          }).join('');

          contentBox.innerHTML = `
            <div class="space-y-8 text-center py-2 my-auto w-full">
              <div>
                <span class="text-3xl font-black uppercase text-purple-600 bg-purple-100 px-8 py-3 rounded-full">Ronda ${subIndex} de 5</span>
              </div>

              <div class="flex flex-wrap items-center justify-center w-full px-2 py-4">
                ${phraseHtml}
              </div>
            </div>
          `;
        }
      } else if (game.order_num === 2) { // Globus
        const subIndex = currentState.active_subround || 0;

        if (subIndex === 0) {
          document.getElementById('gameOrderBadge').parentElement.parentElement.parentElement.classList.add('hidden');
          const sidebarCol = document.getElementById('liveSidebarScores').parentElement;
          sidebarCol.classList.add('hidden');

          contentBox.className = "col-span-12 bg-white rounded-3xl p-8 shadow-sm border-4 border-neutral-100 h-full flex flex-col items-center justify-center text-center relative overflow-hidden";

          contentBox.innerHTML = `
            <div id="introGlobusStep1" class="space-y-8 transition-all duration-1000 ease-in-out opacity-100 scale-100">
              <div class="p-6 rounded-3xl bg-orange-50 text-orange-500 inline-block shadow-inner">
                <i data-lucide="timer" class="w-32 h-32 stroke-[2]"></i>
              </div>
              <h1 class="text-9xl font-black text-neutral-900 tracking-tight">Els Globus</h1>
              <p class="text-6xl font-extrabold text-orange-500">Com va la bufera?</p>
            </div>

            <div id="introGlobusStep2" class="space-y-8 w-full max-w-[95vw] absolute inset-0 m-auto flex flex-col justify-center px-4 transition-all duration-1000 ease-in-out opacity-0 pointer-events-none translate-y-6">
              <div class="space-y-2">
                <span class="text-3xl font-black uppercase text-orange-600 bg-orange-100 px-8 py-3 mb-4 rounded-full">Regles del Joc</span>
                <h2 class="text-7xl font-black text-neutral-900">Com es juga als Globus?</h2>
              </div>

              <div class="grid grid-cols-2 gap-8 text-left">
                <div class="p-8 bg-neutral-50 rounded-2xl border-2 border-neutral-100 space-y-3">
                  <div class="flex items-center gap-3 text-orange-600 font-bold text-4xl">
                    <i data-lucide="clock" class="w-10 h-10"></i> <span>Temps límit</span>
                  </div>
                  <p class="text-3xl text-neutral-700 font-extrabold leading-relaxed">Tothom haurà d'inflar i lligar el seu propi globus en menys de trenta segons!</p>
                </div>

                <div class="p-8 bg-neutral-50 rounded-2xl border-2 border-neutral-100 space-y-3">
                  <div class="flex items-center gap-3 text-orange-600 font-bold text-4xl">
                    <i data-lucide="ruler" class="w-10 h-10"></i> <span>Criteri de puntuació</span>
                  </div>
                  <p class="text-3xl text-neutral-700 font-extrabold leading-relaxed">Es tindrà en compte la rapidesa de l'equip i la mida final dels globus.</p>
                </div>
              </div>
            </div>
          `;

          setTimeout(() => {
            const step1 = document.getElementById('introGlobusStep1');
            const step2 = document.getElementById('introGlobusStep2');
            if (step1 && step2) {
              step1.classList.remove('opacity-100', 'scale-100');
              step1.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none');
              step2.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-6');
              step2.classList.add('opacity-100', 'translate-y-0');
            }
          }, 5000);

        } else {
          document.getElementById('gameOrderBadge').parentElement.parentElement.parentElement.classList.remove('hidden');
          const sidebarCol = document.getElementById('liveSidebarScores').parentElement;
          sidebarCol.classList.remove('hidden');

          contentBox.className = "col-span-8 bg-white rounded-3xl p-6 shadow-sm border-4 border-neutral-100 h-full flex flex-col items-center justify-center text-center space-y-6";

          const currentSecs = currentState.timer_seconds !== undefined ? currentState.timer_seconds : 30;
          const m = Math.floor(currentSecs / 60).toString().padStart(2, '0');
          const s = (currentSecs % 60).toString().padStart(2, '0');

          contentBox.innerHTML = `
            <div class="space-y-6">
              <span class="text-3xl font-black uppercase text-orange-600 bg-orange-100 px-8 py-3 rounded-full">Temps Restant</span>
              <div id="tvTimerDisplay" class="text-[14rem] font-black text-neutral-900 tracking-tight font-mono py-2 leading-none">
                ${m}:${s}
              </div>
              <p id="tvTimerSubtitle" class="text-4xl font-black text-neutral-500">
                ${currentState.timer_running ? 'Temps en marxa! Infleu els globus!' : 'A punt per començar...'}
              </p>
            </div>
          `;

          handleTimerState();
        }
      } else if (game.order_num === 3) { // Taral·larejar
        const subIndex = currentState.active_subround || 0;

        if (subIndex === 0) {
          document.getElementById('gameOrderBadge').parentElement.parentElement.parentElement.classList.add('hidden');
          const sidebarCol = document.getElementById('liveSidebarScores').parentElement;
          sidebarCol.classList.add('hidden');

          contentBox.className = "col-span-12 bg-white rounded-3xl p-8 shadow-sm border-4 border-neutral-100 h-full flex flex-col items-center justify-center text-center relative overflow-hidden";

          contentBox.innerHTML = `
            <div id="introTaralStep1" class="space-y-8 transition-all duration-1000 ease-in-out opacity-100 scale-100">
              <div class="p-6 rounded-3xl bg-amber-50 text-amber-500 inline-block shadow-inner">
                <i data-lucide="music" class="w-32 h-32 stroke-[2]"></i>
              </div>
              <h1 class="text-9xl font-black text-neutral-900 tracking-tight">Taral·larejar</h1>
              <p class="text-6xl font-extrabold text-amber-500">Teniu bona oïda?</p>
            </div>

            <div id="introTaralStep2" class="space-y-8 w-full max-w-[95vw] absolute inset-0 m-auto flex flex-col justify-center px-4 transition-all duration-1000 ease-in-out opacity-0 pointer-events-none translate-y-6">
              <div class="space-y-2">
                <span class="text-3xl font-black uppercase text-amber-600 bg-amber-100 px-8 py-3 mb-4 rounded-full">Regles del Joc</span>
                <h2 class="text-7xl font-black text-neutral-900">Com es juga a Taral·larejar?</h2>
              </div>

      switch (colorName.toLowerCase()) {

        case 'verd': return { bannerBg: '#f0fdf4', bannerBorder: '#bbf7d0', dotColor: '#22c55e', textColor: '#166534' };
        default: return { bannerBg: '#f5f5f5', bannerBorder: '#e5e5e5', dotColor: '#a3a3a3', textColor: '#171717' };
      }
    }

    let timerInterval = null;

    function handleTimerState() {
      const display = document.getElementById('tvTimerDisplay');
      const subtitle = document.getElementById('tvTimerSubtitle');
      if (!display) return;

      const secs = currentState.timer_seconds !== undefined ? currentState.timer_seconds : 30;

      if (currentState.timer_running) {
        if (!timerInterval) {
          timerInterval = setInterval(async () => {
            if (currentState.timer_seconds > 0) {
              currentState.timer_seconds--;
              updateTimerDisplay(currentState.timer_seconds);
            } else {
              clearInterval(timerInterval);
              timerInterval = null;
              currentState.timer_running = false;
              currentState.timer_seconds = 0;

              playBuzzer();

              await db.from('game_state').update({
                timer_running: false,
                timer_seconds: 0,
                updated_at: new Date()
              }).eq('id', 1);

              if (display) {
                display.classList.remove('text-neutral-900', 'text-orange-500', 'text-amber-900', 'animate-timer-beat');
                display.classList.add('text-red-500', 'scale-110');
                display.textContent = "00:00";
              }
              if (subtitle) {
                subtitle.textContent = "TEMPS ESGOTAT!";
                subtitle.className = "text-5xl font-black text-red-500 animate-pulse text-center";
              }
            }
          }, 1000);
        }
      } else {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        if (secs <= 0) {
          display.classList.remove('text-neutral-900', 'text-orange-500', 'text-amber-900', 'animate-timer-beat');
          display.classList.add('text-red-500', 'scale-110');
          display.textContent = "00:00";
          if (subtitle) {
            subtitle.textContent = "TEMPS ESGOTAT!";
            subtitle.className = "text-5xl font-black text-red-500 animate-pulse text-center";
          }
        } else {
          display.classList.remove('text-red-500', 'text-orange-500', 'scale-110', 'animate-timer-beat');
          display.classList.add('text-neutral-900');
          updateTimerDisplay(secs);
          if (subtitle) {
            subtitle.textContent = "A punt per començar...";
            subtitle.className = "text-4xl font-black text-neutral-400 text-center";
          }
        }
      }
    }

    function updateTimerDisplay(secs) {
      const display = document.getElementById('tvTimerDisplay');
      const subtitle = document.getElementById('tvTimerSubtitle');
      if (!display) return;

      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      display.textContent = `${m}:${s}`;

      if (secs <= 10 && secs > 0) {
        playBeep(880, 'square', 0.15);

        display.classList.remove('text-neutral-900', 'text-amber-900');
        display.classList.add('text-orange-500');
        
        display.classList.remove('animate-timer-beat');
        void display.offsetWidth;
        display.classList.add('animate-timer-beat');

        if (subtitle) {
          subtitle.textContent = "Últims segons!";
          subtitle.className = "text-4xl font-black text-orange-500 text-center";
        }
      } else if (secs > 10) {
        playBeep(440, 'sine', 0.08);

        display.classList.remove('text-orange-500', 'text-red-500', 'animate-timer-beat');
        display.classList.add('text-neutral-900');
      }
    }

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    window.addEventListener('click', () => initAudio(), { once: true });

    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.log("Àudio no permès encara");
      }
    }

    function playBuzzer() {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 1.2);

        gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {
        console.log("Àudio no permès encara");
      }
    }
  </script>
</body>
